<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GPS移動軌跡アプリ（制限なし）</title>
    <!-- Leaflet.jsのCSS読み込み -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        #map {
            width: 100%;
            height: 500px;
        }
        #status {
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>GPSリアルタイムマップ（全データ表示）</h1>
    <div id="status">位置情報を取得中...</div>
    <div id="map"></div>

    <!-- Leaflet.jsのJavaScript読み込み -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // 1. 地図の初期化
        const map = L.map('map').setView([35.681236, 139.767125], 15);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let marker = null;
        let circle = null;
        let polyline = null;          
        const routeCoordinates = [];  // 軌跡の座標を蓄積する配列

        // 2. watchPositionで位置を監視（フィルターを撤廃）
        if (!navigator.geolocation) {
            document.getElementById('status').textContent = 'お使いのブラウザは位置情報に対応していません。';
        } else {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    // 精度に関わらずステータスを更新して表示する
                    document.getElementById('status').innerHTML = `
                        <span style="color: blue;">位置情報を更新しました</span><br>
                        緯度: ${lat.toFixed(6)} / 経度: ${lng.toFixed(6)} 
                        (誤差範囲: 約${Math.round(accuracy)}m / 記録点数: ${routeCoordinates.length + 1})
                    `;

                    const latlng = [lat, lng];

                    // 座標を配列に蓄積
                    routeCoordinates.push(latlng);

                    if (!marker) {
                        // 初回：マーカー、精度円、ポリラインの初期化
                        marker = L.marker(latlng).addTo(map).bindPopup('現在地').openPopup();
                        // 誤差が大きい場合は円の色をオレンジにするなどの工夫も可能
                        circle = L.circle(latlng, { radius: accuracy, color: accuracy > 50 ? 'orange' : 'blue' }).addTo(map);
                        
                        polyline = L.polyline(routeCoordinates, {
                            color: 'red',
                            weight: 5,
                            opacity: 0.7
                        }).addTo(map);

                        map.setView(latlng, 16);
                    } else {
                        // 2回目以降：位置を更新
                        marker.setLatLng(latlng);
                        circle.setLatLng(latlng);
                        circle.setRadius(accuracy);
                        circle.setStyle({ color: accuracy > 50 ? 'orange' : 'blue' });

                        // 蓄積された配列をポリラインに再設定して線を延ばす
                        polyline.setLatLngs(routeCoordinates);
                    }
                },
                (error) => {
                    console.error(error);
                    document.getElementById('status').textContent = 'エラー: ' + error.message;
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }
    </script>
</body>
</html>
